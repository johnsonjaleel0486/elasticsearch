x-es-env: &es-env
  cluster.name: jj-lab
  discovery.seed_hosts: es01,es02,es03
  cluster.initial_master_nodes: es01,es02,es03
  xpack.security.enabled: "false"     # Phase 2 turns this on with TLS
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"

services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment: { <<: *es-env, node.name: es01 }
    ports: ["9200:9200"]
    volumes: [es01:/usr/share/elasticsearch/data]
  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment: { <<: *es-env, node.name: es02 }
    volumes: [es02:/usr/share/elasticsearch/data]
  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment: { <<: *es-env, node.name: es03 }
    volumes: [es03:/usr/share/elasticsearch/data]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment: { ELASTICSEARCH_HOSTS: http://es01:9200 }
    ports: ["5601:5601"]
    depends_on: [es01]

volumes: { es01: {}, es02: {}, es03: {} }
