# Logstash: parse raw access-log lines into structured ECS fields, enrich, and index
# into the data stream logs-web-lab (built-in logs-*-* template + "logs" ILM policy).
#
# Example line:
# 2026-11-12T14:00:01Z web02 GET /api/orders 200 87ms user=alice

input {
  beats { port => 5044 }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:[event][original_time]} %{HOSTNAME:[web_host]} %{WORD:[http][request][method]} %{URIPATHPARAM:[url][path]} %{NUMBER:[http][response][status_code]:int} %{NUMBER:[latency_ms]:int}ms user=%{USERNAME:[user][name]}"
    }
  }

  if "_grokparsefailure" in [tags] {
    # Keep bad lines (never silently drop data) but flag them for follow-up
    mutate { add_field => { "[log][level]" => "PARSE_ERROR" } }
  } else {
    # Use the time from the log line, not the time Logstash saw it
    date {
      match  => ["[event][original_time]", "ISO8601"]
      target => "@timestamp"
    }
    if [http][response][status_code] >= 500 {
      mutate { add_field => { "[log][level]" => "ERROR" } }
    } else if [http][response][status_code] >= 400 {
      mutate { add_field => { "[log][level]" => "WARN" } }
    } else {
      mutate { add_field => { "[log][level]" => "INFO" } }
    }
    if [latency_ms] > 1000 { mutate { add_tag => ["slow_request"] } }
    mutate { remove_field => ["[event][original_time]"] }
  }
}

output {
  elasticsearch {
    hosts    => ["https://es01:9200"]
    user     => "logstash_svc"
    password => "${LOGSTASH_ES_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/ca.crt"]
    data_stream           => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "web"
    data_stream_namespace => "lab"
  }
}
